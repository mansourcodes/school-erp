<!doctype html>
<html lang="ar" dir="rtl" data-theme="ghadeer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الرسائل · بوابة الغدير</title>
  <link rel="icon" href="assets/img/logo-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/daisyui.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.12"></script>
  <link href="assets/theme.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js"></script>
</head>
<body data-page="messages" data-title="الرسائل" data-crumb="من مدرّسيك"
      data-states="ready:رسائل,empty:لا رسائل,loading:جارٍ التحميل">
<main class="space-y-4">

  <div role="note" class="alert alert-soft items-start">
    <i data-lucide="info" class="size-5 mt-0.5"></i>
    <span class="text-sm">الرسائل <b>للاطلاع فقط</b> ولا يمكن الرد عليها. للاستفسار راجع مدرّسك في الحصة أو إدارة المركز.</span>
  </div>

  <div data-state="ready" class="space-y-3">
    <p class="text-sm opacity-70" id="count"></p>
    <ul class="space-y-3" id="list"></ul>
  </div>

  <div data-state="empty" class="card-soft" id="empty"></div>
  <div data-state="loading" class="space-y-3" aria-busy="true"><div class="skeleton h-28 w-full"></div><div class="skeleton h-28 w-full"></div><div class="skeleton h-28 w-full"></div></div>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("empty").innerHTML = GH.ui.empty("mail", "لا توجد رسائل", "ستظهر هنا الرسائل التي يرسلها إليك مدرّسوك.");
    var ul = document.getElementById("list");
    function render() {
      var list = GH.inbox(), un = list.filter(function (m) { return !m.read; }).length;
      document.getElementById("count").innerHTML = un ? '<b class="num">' + un + "</b> " + (un === 1 ? "رسالة غير مقروءة" : "رسائل غير مقروءة") : "لا توجد رسائل غير مقروءة";
      ul.innerHTML = list.map(function (m) {
        return '<li><article class="card-soft p-4 ' + (m.read ? "" : "border-primary/40 bg-primary/10") + '" data-msg="' + m.id + '">' +
          '<header class="flex items-center gap-3">' +
            '<div class="arch w-10 h-12 bg-primary text-primary-content grid place-items-center shrink-0 font-display">' + GH.esc(m.initial) + "</div>" +
            '<div class="min-w-0 flex-1"><p class="font-semibold leading-snug flex items-center gap-2">' + GH.esc(m.teacher) +
              (m.read ? "" : '<span class="size-2 rounded-full bg-primary" aria-label="غير مقروءة"></span>') + "</p>" +
            '<p class="text-xs opacity-70 truncate">' + GH.esc(m.curriculum) + ' · الصف <span class="num whitespace-nowrap">' + GH.esc(m.classroom) + "</span></p></div>" +
            '<time class="text-xs opacity-60 shrink-0 num">' + GH.fmtAgo(m.sent_at) + "</time></header>" +
          '<p class="mt-3 leading-relaxed ' + (m.read ? "" : "font-medium") + ' line-clamp-3" data-body>' + GH.esc(m.body) + "</p>" +
          '<button class="btn btn-ghost btn-sm text-primary mt-1 -ms-2" data-more hidden>عرض المزيد</button>' +
          "</article></li>";
      }).join("");
      // "عرض المزيد" only where the text is actually clamped
      ul.querySelectorAll("[data-body]").forEach(function (p) { if (p.scrollHeight > p.clientHeight + 2) p.parentNode.querySelector("[data-more]").hidden = false; });
      GH.icons();
    }
    // opening a message marks it read (POST /student/messages/{id}/read)
    ul.addEventListener("click", function (e) {
      var card = e.target.closest("[data-msg]"); if (!card) return;
      var body = card.querySelector("[data-body]");
      body.classList.remove("line-clamp-3"); card.querySelector("[data-more]").hidden = true;
      var id = +card.getAttribute("data-msg");
      if (!GH.inbox().filter(function (m) { return m.id === id; })[0].read) {
        GH.markRead(id);
        card.classList.remove("border-primary/40", "bg-primary/10"); body.classList.remove("font-medium");
        var dot = card.querySelector(".size-2.rounded-full"); if (dot) dot.remove();
        var un = GH.unread();
        document.getElementById("count").innerHTML = un ? '<b class="num">' + un + "</b> " + (un === 1 ? "رسالة غير مقروءة" : "رسائل غير مقروءة") : "لا توجد رسائل غير مقروءة";
        document.querySelectorAll('a[href="messages.html"] .badge').forEach(function (b) { if (un) b.textContent = un; else b.remove(); });
      }
    });
    render();
  });
</script>
</body>
</html>
